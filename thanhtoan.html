<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uniqlo - Thanh toán</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tự động load Header -->
    <div id="header-container"></div>

    <main style="background-color: var(--light-gray);">
        <div class="checkout-container">
            <!-- Bên trái: Form Nhập Liệu -->
            <div class="checkout-left">
                <h3>1. Địa chỉ nhận hàng</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tên người nhận</label>
                        <input type="text" id="checkout-name" placeholder="Nhập tên người nhận">
                    </div>
                    <div class="form-group">
                        <label>Số điện thoại</label>
                        <input type="text" id="checkout-phone" placeholder="Nhập số điện thoại">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Thành phố / Tỉnh</label>
                        <select id="checkout-city">
                            <option value="">Chọn Thành phố</option>
                            <option value="HCM">TP. Hồ Chí Minh</option>
                            <option value="HN">Hà Nội</option>
                            <option value="DN">Đà Nẵng</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Quận / Huyện</label>
                        <input type="text" id="checkout-district" placeholder="Nhập Quận/Huyện">
                    </div>
                </div>
                <div class="form-group">
                    <label>Địa chỉ chi tiết</label>
                    <input type="text" id="checkout-address" placeholder="Số nhà, tên đường, phường/xã...">
                </div>
                <div class="method-option">
                    <label class="checkbox-container" style="font-size: 14px;">
                        <input type="checkbox" id="default-addr"> Thiết lập làm địa chỉ mặc định
                    </label>
                </div>

                <h3 style="margin-top: 40px;">2. Phương thức thanh toán</h3>
                <div class="method-option">
                    <label class="checkbox-container" style="font-size: 14px;">
                        <input type="radio" name="payment" value="card" checked> Thẻ quốc tế (Visa/MasterCard/JCB)
                    </label>
                </div>
                <div class="method-option">
                    <label class="checkbox-container" style="font-size: 14px;">
                        <input type="radio" name="payment" value="ewallet"> Ví điện tử (Momo, ZaloPay, VNPay)
                    </label>
                </div>
                <div class="method-option">
                    <label class="checkbox-container" style="font-size: 14px;">
                        <input type="radio" name="payment" value="cod"> Thanh toán khi nhận hàng (COD)
                    </label>
                </div>
            </div>

            <!-- Bên phải: Tóm tắt đơn hàng (Được render tự động bằng JS) -->
            <div class="checkout-right" id="checkout-summary-container">
                <!-- JS sẽ đổ dữ liệu giỏ hàng vào đây -->
            </div>
        </div>
    </main>

    <!-- Tự động load Footer -->
    <div id="footer-container"></div>

    <script src="./data/data.js"></script>
    <script src="app.js"></script>
</body>
</html>
